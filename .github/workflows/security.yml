name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

permissions: {}

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only runs on pull requests — compares new deps against known vulnerabilities
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One summary comment per PR (vulnerabilities, licenses, OpenSSF Scorecard), updated in place.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # The gems in Gemfile.lock are all this site depends on. This scan is what
  # notices a known vulnerability in one of them; an accepted finding goes into
  # .trivyignore with its justification.
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy on repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail the build on HIGH/CRITICAL vulnerabilities

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Every action in these workflows is pinned to a commit SHA, with its version
  # in a comment. This checks that each SHA is the commit of the version named
  # beside it, so a wrong SHA and a tag moved upstream both fail here.
  pins:
    name: Pinned actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each SHA against the tag it names
        run: .github/scripts/verify-pins.sh

  # Dependabot raises no alert for an action pinned by SHA, so this asks GitHub's
  # advisory database about every pinned version in its place.
  actions-audit:
    name: Actions audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look up each pinned version in the advisory database
        run: .github/scripts/verify-pins.sh --advisories
        env:
          GH_TOKEN: ${{ github.token }}
