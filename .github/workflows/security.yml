name: Security

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # One summary comment per PR (vulnerabilities, licenses, OpenSSF Scorecard), updated in place.
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
